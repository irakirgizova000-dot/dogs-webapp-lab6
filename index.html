<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Породы собак</title>
</head>
<body>
    <div class="container">
        <h2>Выберите породу:</h2>
        <div class="inner">
            <div class="item">
                <img src="1.png" alt="Лабрадор" class="img">
                <button class="btn" id="btn1">Лабрадор</button>
            </div>
            <div class="item">
                <img src="2.png" alt="Немецкая овчарка" class="img">
                <button class="btn" id="btn2">Немецкая овчарка</button>
            </div>
            <div class="item">
                <img src="3.png" alt="Хаски" class="img">
                <button class="btn" id="btn3">Хаски</button>
            </div>
            <div class="item">
                <img src="4.png" alt="Мопс" class="img">
                <button class="btn" id="btn4">Мопс</button>
            </div>
            <div class="item">
                <img src="5.png" alt="Бульдог" class="img">
                <button class="btn" id="btn5">Бульдог</button>
            </div>
            <div class="item">
                <img src="6.png" alt="Такса" class="img">
                <button class="btn" id="btn6">Такса</button>
            </div>
            <div class="item">
                <img src="7.png" alt="Пудель" class="img">
                <button class="btn" id="btn7">Пудель</button>
            </div>
            <div class="item">
                <img src="8.png" alt="Чихуахуа" class="img">
                <button class="btn" id="btn8">Чихуахуа</button>
            </div>
        </div>
    </div>
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
       <script src="app.js?v=100"></script>
</body>
</html>
